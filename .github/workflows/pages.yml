name: pages
# Показ на GitHub Pages: сайт в подпапке /rozalii, закрыт от поиска (PUBLIC_NOINDEX=1), заявки – тестовый стенд.
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # тесты замка админки (оба входа открывают, неверный – нет)
      - run: npm test
      # реальная аналитика админки лежит в репо зашифрованной – открыть ключом входа до сборки
      - name: Открыть данные аналитики
        run: node scripts/seal-data.mjs --open
        env: { ADMIN_LOGIN: '${{ secrets.ADMIN_LOGIN }}', ADMIN_PASS: '${{ secrets.ADMIN_PASS }}' }
      - run: npm run build
        env: { PUBLIC_SITE_URL: 'https://tema-mail.github.io', PUBLIC_BASE: /rozalii, PUBLIC_NOINDEX: '1' }
      # вся админка (/admin) – за логином и паролем; без секретов шаг падает и открытая админка не публикуется
      - name: Закрыть админку логином и паролем
        run: node scripts/lock-admin.mjs
        # второй вход – СВЕРХ админ Артёма; нет секретов – один вход владельца и предупреждение
        env: { ADMIN_LOGIN: '${{ secrets.ADMIN_LOGIN }}', ADMIN_PASS: '${{ secrets.ADMIN_PASS }}', SVERH_LOGIN: '${{ secrets.SVERH_LOGIN }}', SVERH_PASS: '${{ secrets.SVERH_PASS }}' }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
