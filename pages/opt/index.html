<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Розалия – кабинет оптовика</title>
<style>
:root{
  --bg:#f5f3ef;--card:#fff;--fg:#1f1d1a;--mut:#6f6a62;--line:#e5e0d6;
  --acc:#3d4a3f;--acc-2:#8a6d45;--ok:#2f6b45;--warn:#a2621c;--bad:#a23a2e;--soft:#efebe3;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
input[type=range]{accent-color:var(--acc-2);width:100%}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:#262a26;color:#e9e6df;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;letter-spacing:.02em;padding:4px 10px 2px}
.brand small{display:block;font-weight:400;font-size:12px;color:#a9a59c}
.side a{display:flex;justify-content:space-between;align-items:center;color:#d6d2c9;text-decoration:none;padding:9px 10px;border-radius:8px}
.side a:hover{background:#30352f}
.side a.on{background:#3d4a3f;color:#fff}
.side .cnt{background:var(--acc-2);color:#fff;border-radius:10px;font-size:12px;padding:0 7px}
.side .gap{flex:1}
.side .mgr{font-size:13px;color:#bdb8ae;padding:10px;border-top:1px solid #3a3f39}
main{padding:20px 28px 90px;max-width:1240px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:0;background:var(--acc);color:#fff;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.sec{background:var(--soft);color:var(--fg)}
.btn.line{background:none;border:1px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative}
.card h3{margin:0 0 8px;font-size:15px}
.k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.v{font-size:24px;font-weight:700;line-height:1.2;margin:4px 0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc-2);border-radius:6px}
.ladder{display:flex;gap:4px;margin-top:8px}
.ladder div{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:6px;background:var(--soft);color:var(--mut)}
.ladder div.on{background:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tw{overflow-x:auto}
.st{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--soft);white-space:nowrap}
.st.ok{background:#e3efe6;color:var(--ok)}.st.warn{background:#f6ead9;color:var(--warn)}.st.bad{background:#f3e0dd;color:var(--bad)}.st.info{background:#e4e8ef;color:#38507a}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft)}
.prod .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .t{font-weight:600;font-size:14px;line-height:1.3}
.prod .p{display:flex;align-items:baseline;gap:8px}
.prod .p b{font-size:17px}
.prod .p s{color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.qty button{border:0;background:var(--soft);width:32px;height:32px;cursor:pointer;font-size:16px}
.qty input{width:44px;border:0;text-align:center;height:32px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.note{display:none;margin-top:10px;background:#fbf6e9;border:1px dashed #d9c49a;border-radius:8px;padding:8px 10px;font-size:13px;color:#5c4a2a}
body.explain .note{display:block}
.note b{color:#3e2f14}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#262a26;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tier{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.tier.on{border-color:var(--acc-2);box-shadow:0 0 0 2px var(--acc-2) inset}
.tier ul{padding-left:18px;margin:6px 0 0;font-size:13px}
.banner{background:#e9eee8;border:1px solid #cfd9cd;border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:14px}
.empty{padding:30px;text-align:center;color:var(--mut)}
.mob{display:none}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.tiers{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:14px 16px 90px}
  .g3,.g2{grid-template-columns:1fr}
  .prods{grid-template-columns:repeat(2,1fr);gap:10px}
  .top h1{font-size:20px}
  .mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:#262a26;z-index:40;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  .mob a{color:#d6d2c9;text-decoration:none;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px}
  .mob a.on{color:#fff}
  .mob a span{font-size:18px;line-height:1}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.v{font-size:20px}.tiers{grid-template-columns:1fr}}
</style>
</head>
<body class="explain">
<div class="app">
  <aside class="side">
    <div class="brand">Розалия <small>кабинет оптовика</small></div>
    <nav id="nav"></nav>
    <div class="gap"></div>
    <div class="mgr" id="mgr"></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title"></h1>
      <div class="row">
        <label class="tg"><input type="checkbox" id="explain" checked> Пояснения: что и откуда</label>
        <button class="btn line sm" id="reset">Сбросить демо</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<nav class="mob" id="mob"></nav>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
